<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Horloge">
  <title>Horloge Météo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section class="panel" id="clock-panel">
      <div class="clock">
        <div class="time"><span id="hhmm">--:--</span><span id="ss" class="seconds">--</span></div>
        <div id="date" class="date"></div>
        <div id="next-alarm" class="next-alarm" hidden></div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="panel" id="weather-panel">
      <div class="weather">
        <div id="w-place" class="place">Météo</div>
        <div class="now">
          <div id="w-icon" class="icon" aria-hidden="true"></div>
          <div id="w-temp" class="temp">--°</div>
        </div>
        <div id="w-desc" class="desc">Chargement…</div>
        <div id="w-details" class="details"></div>
        <div id="w-hours" class="hours"></div>
        <div id="w-updated" class="updated"></div>
      </div>
    </section>

    <button id="open-settings" class="corner-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </main>

  <!-- Start screen: a tap unlocks sound, keeps the screen on and switches to fullscreen -->
  <div id="start" class="overlay start">
    <div>
      <div class="start-title">Toucher pour démarrer</div>
      <div class="start-sub">active le son du réveil et garde l'écran allumé</div>
    </div>
  </div>

  <!-- Ringing alarm -->
  <div id="ring" class="overlay ring" hidden>
    <div class="ring-time" id="ring-time">--:--</div>
    <div class="ring-label" id="ring-label">Réveil</div>
    <div class="ring-actions">
      <button id="snooze" class="big-btn">Répéter<br><small>9 min</small></button>
      <button id="stop" class="big-btn">Arrêter</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="overlay settings" hidden>
    <div class="settings-inner">
      <header class="settings-head">
        <h1>Réglages</h1>
        <button id="close-settings" class="text-btn">Fermer</button>
      </header>

      <section>
        <h2>Affichage</h2>
        <label class="row">
          <span>Luminosité</span>
          <input id="brightness" type="range" min="5" max="100" step="1">
        </label>
        <label class="row">
          <span>Afficher les secondes</span>
          <input id="show-seconds" type="checkbox">
        </label>
        <button id="fullscreen" class="text-btn">Plein écran</button>
      </section>

      <section>
        <h2>Réveils</h2>
        <div id="alarm-list"></div>
        <div class="btn-row">
          <button id="add-alarm" class="text-btn">+ Ajouter un réveil</button>
          <button id="test-sound" class="text-btn">Tester le son</button>
        </div>
        <p class="hint">L'application doit rester ouverte (écran allumé, tout faiblement) pour que le réveil sonne. Branchez le téléphone pour la nuit.</p>
      </section>

      <section>
        <h2>Lieu de la météo</h2>
        <div id="loc-current" class="hint"></div>
        <button id="use-gps" class="text-btn">Utiliser ma position</button>
        <form id="city-form" class="city-form">
          <input id="city-input" type="search" placeholder="Rechercher une ville" autocomplete="off">
          <button class="text-btn" type="submit">OK</button>
        </form>
        <div id="city-results"></div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
